<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Question 2</title>
    </head>
    <body>
        <p id="result"></p>
        <script>
            const num1 = Number(prompt("Enter your first number: "));
            const num2 = Number(prompt("Enter your second number"));
            function addNumerators(a,b) {
                let number = (parseFloat(a+b));
                return number
            }
            numfinal = addNumerators(num1,num2)
            document.getElementById("result").innerHTML = numfinal;
        </script>
    </body>
</html>
