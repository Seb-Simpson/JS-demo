<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            numsAvg = Number(prompt("Enter how many numbers you want to be averaged: "))
            let total = 0
            let final = 0
            for (let i = 0; i < numsAvg; i++) {
                num1 = Number(prompt("Enter the number to average: "))     
                total += num1           
            };
            final = total/numsAvg;
            document.write(final);
        </script>
    </body>
</html>
