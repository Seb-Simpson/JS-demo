<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            originalB = Number(prompt("Enter your original balance"));
            interestrate = Number(prompt("Enter your interest rate in either percentage or decimal form "));
            if (interestrate > 1) {
                interestrate = interestrate / 100;
            }
            let year = 0
            desiredbalance = Number(prompt("Enter desired balance "))
            while (originalB < desiredbalance) {
                originalB = originalB + originalB * (interestrate);
                document.write("Year " + year + " Balance: " + originalB + "<br>")
                year ++
                console.log(originalB, interestrate, desiredbalance)
            }
        </script>
    </body>
</html>
